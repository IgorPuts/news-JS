<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>News Portal</title>
    </head>
    <body>
        <header>
            <h1>News <span class="accent">Portal</span></h1>
        </header>

        <main>
            <!-- Панель управления источниками -->
            <section class="sources-panel">
                <div class="search-bar">
                    <input type="text" id="search-sources" placeholder="Search sources..." />
                    <span class="sources-count">0 of 0</span>
                </div>

                <div class="categories">
                    <button class="category-btn active" data-category="all">All</button>
                    <button class="category-btn" data-category="pinned">★ Pinned - 0</button>
                    <button class="category-btn" data-category="business">Business</button>
                    <button class="category-btn" data-category="entertainment">Entertainment</button>
                    <button class="category-btn" data-category="general">General</button>
                    <button class="category-btn" data-category="health">Health</button>
                    <button class="category-btn" data-category="science">Science</button>
                    <button class="category-btn" data-category="sports">Sports</button>
                    <button class="category-btn" data-category="technology">Technology</button>
                </div>


                <div class="sources"></div>
            </section>


            <section class="news-section">
                <h2 class="news-title">News from ...</h2>
                <div class="news"></div>
            </section>
        </main>

        <footer>
            <div class="footer-content">
                <a href="https://github.com/IgorPuts" target="_blank">GitHub</a>
                <span>2026</span>
                <a href="https://rs.school/courses/javascript" target="_blank">
                    <img src="" id="rs-logo" alt="RS School" width="40">
                </a>
            </div>
        </footer>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
